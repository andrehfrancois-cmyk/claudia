<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Professor - Feira do Tomazinho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main class="admin-wrap">
    <div class="secao-titulo">
      <div>
        <h3>Painel do Professor</h3>
        <p>Cadastro de produtos, alunos e controle de vendas</p>
      </div>
      <a class="btn btn-secundario" href="/">Voltar para loja</a>
    </div>

    <section class="admin-grid">
      <article class="quadro">
        <h4>Cadastrar produto</h4>
        <div class="campos-admin">
          <div class="campo">
            <label for="nome">Nome do produto</label>
            <input id="nome" type="text" placeholder="Ex.: Chaveiro personalizado">
          </div>
          <div class="campo">
            <label for="preco">Preço em Tomazinhos</label>
            <input id="preco" type="number" min="1" placeholder="Ex.: 8">
          </div>
          <div class="campo">
            <label for="turma">Turma</label>
            <input id="turma" type="text" placeholder="Ex.: 2ºA">
          </div>
          <div class="campo">
            <label for="icone">Emoji / ícone</label>
            <input id="icone" type="text" placeholder="Ex.: 🎁">
          </div>
          <div class="campo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" rows="4" placeholder="Descrição do produto"></textarea>
          </div>
        </div>

        <div class="acoes-carrinho">
          <button class="btn btn-principal" onclick="cadastrarProduto()">Salvar produto</button>
          <button class="btn btn-secundario" onclick="limparFormulario()">Limpar</button>
        </div>
        <div class="mensagem" id="mensagemAdmin"></div>
      </article>

      <article class="quadro">
        <h4>Produtos cadastrados</h4>
        <div id="listaProdutos" class="lista-admin"></div>
      </article>
    </section>

    <section class="admin-grid admin-extra">
      <article class="quadro">
        <h4>Alunos e saldos</h4>
        <div id="listaAlunos" class="lista-admin"></div>
      </article>

      <article class="quadro">
        <h4>Vendas realizadas</h4>
        <div id="listaVendas" class="lista-vendas"></div>
      </article>
    </section>
  </main>

  <script src="./admin.js"></script>
</body>
</html>
